<h2>Rxjs operator</h2>
<form [formGroup]="myForm">
    <div class="col-4 ms-2 mb-2">
        <input type="text" formControlName="search" class="form-control">
    </div>
</form>
<ol>
    <li *ngFor="let data of users">{{data?.firstName + " " + data?.lastName}}</li>
</ol>
<button id="stop">stop</button>
<div class="mt-2 ms-3">
    <h2>parent component</h2>
    <input type="text" [(ngModel)]="inputValue">
    <span class="text-danger"> {{inputValue}}</span>
    <button (click)="myClick()">click me</button>
    <app-excersice [(name)]="inputValue">
    </app-excersice>
</div>
